knife4j:
  enable: true
  setting:
    language: zh_cn
server:
  port: 8123
  servlet:
    context-path: /api
mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: isDeleted # 默认字段名为 deleted
      logic-delete-value: 1
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
  configuration:
     map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml  # XML文件位置
  type-aliases-package: com.ai.aigent.entity  # 实体类包