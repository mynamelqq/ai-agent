spring:
  config:
    import: optional:classpath:application-local.yml
  data:
    redis:
      client-name: redis-local
      database: 0
      host: 192.168.86.1
      port: 6379

  rabbitmq:
    host: 192.168.86.1
    port: 5672
    username: appuser

    password: 123321
    virtual-host: /
    # 发布器等待 Broker confirm；首次发布失败不记 published_at，转发失败不 ACK 原消息。
    publisher-confirm-type: correlated
    # mandatory + returns 用于发现交换机未将消息路由到任何队列。
    publisher-returns: true
    template:
      mandatory: true
  datasource:
    mysql:
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://192.168.86.1:3306/love_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
        username: root
        password: 88559886
    postgresql:
        driver-class-name: org.postgresql.Driver
        jdbc-url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/postgres}
        username: ${POSTGRES_USERNAME:postgres}
        password: ${POSTGRES_PASSWORD:123456}
  application:
    name: ai-gent

  ai:
    mcp:
      client:
#        sse:
#          connections:
#            server1:
#              url: http://localhost:8127
        stdio:
          servers-configuration: classpath:mcp-githubTool.json

agent:
  manus:
    chat:
      provider: openai
      model: deepseek-v4.1-flash-1017
sandbox:
  enabled: true


springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.ai.aigent.controller

# knife4j???????????????
knife4j:
  enable: true
  setting:
    language: zh_cn
server:
  port: 8123
  servlet:
    context-path: /api
mybatis-plus:
  configuration:
     map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml  # XML文件位置
  type-aliases-package: com.ai.aigent.entity  # 实体类包

logging:
  level:
    org.springframework.ai: DEBUG


